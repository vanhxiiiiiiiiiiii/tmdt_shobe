name: E-shopee CI

on:
  push:
    branches: [main, master, 2.x.x]
  pull_request:
    branches: [main, master, 2.x.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: eshopee_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptesting"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: eshopee_test
      DB_USERNAME: root
      DB_PASSWORD: testing
      REPORT_CACHE_STORE: array
      CACHE_STORE: array
      CACHE_DRIVER: array
      RUN_MYSQL_CHECKOUT_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, gd, bcmath
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Check PHP syntax
        run: find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          mysql -h 127.0.0.1 -uroot -ptesting -e "SET GLOBAL log_bin_trust_function_creators = 1;"
          php artisan migrate --force
          php artisan db:seed --class=ProductStatusSeeder --force
          php artisan db:seed --class=OrderStatusSeeder --force
      - name: Run tests
        run: php artisan test --no-ansi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@9.15.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Vue application
        run: pnpm build
