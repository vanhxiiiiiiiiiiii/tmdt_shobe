services:
    api:
        build:
            context: .
        image: e-commerce-api
        ports:
            - 8080:80
            - 443:443
        volumes:
            - ./:/var/www/html
            - ./.docker/api/nginx/ssl:/etc/nginx/ssl
            - ./.docker/api/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - mysql-network
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - ./.docker/mysql/data:/var/lib/mysql
        networks:
            - mysql-network
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    adminer:
        image: adminer:4
        ports:
        - 8081:80
        networks:
            - mysql-network
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        networks:
            - mysql-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        restart: unless-stopped

networks:
    mysql-network:

volumes:
    redis-data:
