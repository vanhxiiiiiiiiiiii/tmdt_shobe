apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-network
spec:
  podSelector:
    matchLabels:
      app: mysql
      component: database
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: database
        - podSelector:
            matchLabels:
              app: api
              component: api
      ports:
        - port: 3306
